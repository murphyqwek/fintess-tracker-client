<div class="min-h-screen bg-slate-200 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    
    <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">
      Авторизация
    </h2>

    <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Логин</label>
        <input 
          type="text" 
          formControlName="login"
          (focus)="clearError('login')"
          placeholder="Login"
          [class.border-red-500]="isFieldInvalid('login')"
          [class.focus:ring-red-200]="isFieldInvalid('login')"
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
        @if (isFieldInvalid('login')) {
          <p class="text-red-500 text-xs mt-1">
            Длина логина должна быть от 6 до 20 символов
          </p>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Пароль</label>
        <input 
          type="password" 
          formControlName="password"
          (focus)="clearError('password')"
          placeholder="••••••••"
          [class.border-red-500]="isFieldInvalid('password')"
          [class.focus:ring-red-200]="isFieldInvalid('password')"
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
        @if (isFieldInvalid('password')) {
          <p class="text-red-500 text-xs mt-1">
            Длина пароля должна быть от 6 до 20 символов
          </p>
        }
      </div>

      @if (isFailedToAuth()) {
        <p class="text-red-500 text-xs mt-1">
        Неверный логин или пароль
        </p>
      }

      <button 
        type="submit" 
        class="w-full mt-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2.5 rounded-lg transition shadow-md hover:shadow-lg">
        Авторизироваться
      </button>

      <p class="text-sm text-center text-slate-600 mt-4">
        Нет аккаунта? 
        <a routerLink="/register" class="text-blue-600 hover:underline font-medium">Создайте его</a>
      </p>

    </form>
  </div>
</div>
